name: tests

# Builds every fictional scenario in tests/scenarios with the real scripts and compares the text
# of each POA with tests/expected. Needs pandoc, LibreOffice, and poppler, the same tools a user
# installs (see the README).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandoc, LibreOffice, poppler, fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer poppler-utils fonts-liberation
          python -m pip install --quiet Pillow

      - name: Doctor (required tools; the attorney setting is supplied for the check)
        run: python skills/seller-poa/scripts/doctor.py --attorney-in-fact "Alex Q. Attorney, Esq."

      - name: Regression suite
        run: python tests/run_tests.py

  # The same suite on Windows, the system most firms run Claude Code on. LibreOffice and pandoc
  # are installed with Chocolatey; neither installer puts its folder on the PATH of later steps,
  # so both are added explicitly (the scripts also look in LibreOffice's install folder).
  regression-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandoc, LibreOffice, PyMuPDF
        shell: pwsh
        run: |
          # The Chocolatey feed sometimes answers 503; retry, and fail this step (not a later one)
          # if either program is still missing -- choco's own failure does not stop pwsh.
          foreach ($attempt in 1..3) {
            choco install pandoc libreoffice-fresh -y --no-progress
            if ((Test-Path "C:\Program Files\Pandoc\pandoc.exe") -and
                (Test-Path "C:\Program Files\LibreOffice\program\soffice.exe")) { break }
            if ($attempt -eq 3) { throw "pandoc or LibreOffice did not install (Chocolatey feed down?)" }
            Start-Sleep -Seconds (60 * $attempt)
          }
          "C:\Program Files\Pandoc" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Program Files\LibreOffice\program" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          python -m pip install --quiet pymupdf Pillow

      - name: Doctor (required tools; the attorney setting is supplied for the check)
        run: python skills/seller-poa/scripts/doctor.py --attorney-in-fact "Alex Q. Attorney, Esq."

      - name: Regression suite
        run: python tests/run_tests.py
